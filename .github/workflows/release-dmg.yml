name: Build DMG

# Build distributable DMGs for both Apple Silicon (arm64) and Intel (x86_64)
# whenever code lands on main. Artifacts are attached to the workflow run and,
# when the push is a version tag (vX.Y.Z), published as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-dmg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} DMG
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: apple-silicon
          - arch: x86_64
            label: intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show build environment
        run: |
          xcodebuild -version
          echo "Building for arch: ${{ matrix.arch }}"

      - name: Build Owlet (Release, ${{ matrix.arch }})
        run: |
          set -euo pipefail
          xcodebuild \
            -project Owlet.xcodeproj \
            -scheme Owlet \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            ARCHS='${{ matrix.arch }}' \
            VALID_ARCHS='${{ matrix.arch }}' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Verify built architecture
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Owlet.app"
          BIN="$APP/Contents/MacOS/Owlet"
          echo "Binary architectures:"
          lipo -archs "$BIN"
          lipo -archs "$BIN" | grep -qw '${{ matrix.arch }}'

      - name: Read app version
        id: version
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Owlet.app"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Package DMG
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Owlet.app"
          OUT="dist/Owlet-${{ steps.version.outputs.version }}-${{ matrix.label }}.dmg"
          mkdir -p dist
          bash scripts/make-dmg.sh "$APP" "$OUT" "Owlet ${{ steps.version.outputs.version }}"
          echo "Artifacts:"
          ls -lh dist

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Owlet-${{ matrix.label }}-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
